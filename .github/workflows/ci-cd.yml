name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"   # same as Dockerfile.prod, so CI tests what actually runs

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatewayguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gatewayguard
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: github-actions-test-secret-key-at-least-32-bytes
      ENVIRONMENT: testing
      LOG_LEVEL: WARNING
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: requirements*.txt

    - name: Install dependencies (exact pinned versions, no overrides)
      run: pip install -r requirements-dev.txt

    - name: Migrate database (tests the real migrations, not create_all)
      run: |
        python scripts/migrate.py
        alembic check   # fails if the models changed without a new migration

    - name: Run tests
      run: pytest tests/ -v --cov=app --cov-report=term --timeout=60

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - run: pip install ruff==0.17.0
    # No --fix: CI must fail on problems, not silently repair them and go green.
    - run: ruff check app/ tests/ scripts/ --output-format=github

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - run: pip install pip-audit==2.9.0
    # Blocking on purpose: a known-vulnerable dependency fails the build.
    - run: pip-audit -r requirements.txt

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatewayguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4
    - name: Build production image
      run: docker build -f Dockerfile.prod -t gatewayguard:ci .

    - name: Migrations run inside the image (runtime dependencies only)
      run: |
        docker run --rm --network host \
          -e ENVIRONMENT=production \
          -e JWT_SECRET=ci-smoke-test-secret-that-is-long-enough-123456 \
          -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/gatewayguard \
          gatewayguard:ci python scripts/migrate.py

    - name: Image refuses to start without a real JWT secret
      run: |
        if docker run --rm -e ENVIRONMENT=production gatewayguard:ci \
             python -c "import app.config" 2>/dev/null; then
          echo "FAIL: production image started with the default JWT secret"; exit 1
        fi

    - name: Image runs as non-root and answers /health/live
      run: |
        docker run -d --name gg -p 8000:8000 \
          -e ENVIRONMENT=production \
          -e JWT_SECRET=ci-smoke-test-secret-that-is-long-enough-123456 \
          gatewayguard:ci
        test "$(docker exec gg id -u)" != "0"
        for i in $(seq 1 20); do
          curl -fs http://localhost:8000/health/live && exit 0
          sleep 2
        done
        docker logs gg; exit 1
