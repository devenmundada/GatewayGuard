name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatewayguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-n: '3.12'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx
        pip install email-validator
    
    - name: 🔍 Run tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gatewayguard
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET: github-actions-test-secret-key
        JWT_ALGORITHM: HS256
        JWT_EXPIRE_MINUTES: 15
        ENVIRONMENT: testing
        LOG_LEVEL: INFO
        ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000
        PYTHONPATH: .
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
      continue-on-error: false

  lint:
    name: 🔍 Lint Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: 📦 Install ruff --upgrade
      run: |
        pip install ruff --upgrade
    
    - name: 🔍 Run Ruff linter
      run: |
        ruff check app/ --output-format=github --fix

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: 📦 Install safety
      run: |
        pip install safety
    
    - name: 🔍 Check dependencies
      run: |
        safety check -r requirements.txt --ignore=70612 --ignore=51457
      continue-on-error: true
