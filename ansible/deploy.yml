---
# Passwords come from ansible/secrets.yml (gitignored; see secrets.yml.example).
# Run:  ansible-playbook -i hosts.ini deploy.yml   (add --ask-vault-pass if secrets.yml is encrypted)
# Open the cluster ports every node needs (pod networking + kubelet) on all hosts.
- name: Open Kubernetes node ports
  hosts: all
  become: true
  tasks:
    - name: Flannel VXLAN (pod-to-pod traffic between nodes)
      ufw:
        rule: allow
        port: "8472"
        proto: udp

    - name: Kubelet API
      ufw:
        rule: allow
        port: "10250"
        proto: tcp

- name: Setup database server
  hosts: db
  become: true
  vars_files:
    - secrets.yml
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: no

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Open PostgreSQL port
      ufw:
        rule: allow
        port: "5432"

    - name: Run PostgreSQL container
      no_log: true   # do not print the password in Ansible output
      docker_container:
        name: postgres
        image: postgres:16-alpine
        state: started
        restart_policy: always
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "{{ db_password }}"
          POSTGRES_DB: gatewayguard

- name: Setup cache server
  hosts: cache
  become: true
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: no

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Open Redis port
      ufw:
        rule: allow
        port: "6379"

    - name: Run Redis container
      docker_container:
        name: redis
        image: redis:7-alpine
        state: started
        restart_policy: always
        ports:
          - "6379:6379"

- name: Setup app server
  hosts: app
  become: true
  vars_files:
    - secrets.yml
  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: no

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Open app port
      ufw:
        rule: allow
        port: "8000"

    - name: Run GatewayGuard container
      no_log: true
      docker_container:
        name: gatewayguard
        image: gatewayguard
        state: started
        restart_policy: always
        ports:
          - "8000:8000"
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:{{ db_password }}@192.168.252.3:5432/gatewayguard"
          JWT_SECRET: "{{ jwt_secret }}"
          REDIS_URL: "redis://192.168.252.4:6379/0"
          ENVIRONMENT: "production"
