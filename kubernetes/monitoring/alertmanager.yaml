apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: default
data:
  alertmanager.yml: |
    route:
      receiver: telegram
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secret/token
            chat_id: 6834514234
            send_resolved: true
            message: "{{ .Status | toUpper }}: {{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}{{ end }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      nodeSelector:
        kubernetes.io/hostname: gg-db
      containers:
        - name: alertmanager
          image: prom/alertmanager:latest
          args:
            - --config.file=/etc/alertmanager/config/alertmanager.yml
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/config
            - name: secret
              mountPath: /etc/alertmanager/secret
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secret
          secret:
            secretName: telegram-bot
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
      nodePort: 30093
