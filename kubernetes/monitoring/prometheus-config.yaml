apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
      - job_name: 'gatewayguard'
        static_configs:
          - targets: ['192.168.252.2:30080']
        metrics_path: '/metrics'
  alert-rules.yml: |
    groups:
      - name: gatewayguard-alerts
        rules:
          - alert: GatewayGuardDown
            expr: up{job="gatewayguard"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "GatewayGuard is unreachable"
              description: "Prometheus could not scrape GatewayGuard for 1 minute."
