apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['192.168.252.3:30093']
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
      - job_name: 'gatewayguard'
        static_configs:
          - targets: ['192.168.252.2:30080']
        metrics_path: '/metrics'
  alert-rules.yml: |
    groups:
      - name: gatewayguard-alerts
        rules:
          - alert: GatewayGuardDown
            expr: up{job="gatewayguard"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "GatewayGuard is unreachable"
              description: "Prometheus could not scrape GatewayGuard for 1 minute."

          - alert: GatewayGuardHighErrorRate
            expr: |
              sum(rate(http_requests_total{status=~"5.."}[5m]))
                / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "More than 5% of requests are failing with 5xx"
              description: "5xx ratio over the last 5 minutes: {{ $value | humanizePercentage }}"
