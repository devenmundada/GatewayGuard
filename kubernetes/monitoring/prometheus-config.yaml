apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'gatewayguard'
        static_configs:
          - targets: ['192.168.252.2:30080']
        metrics_path: '/metrics'
